[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simreach"
version = "0.2.0"
description = "ROS 2 + Gazebo vision-guided approach scaffold (unit-testable core, sim-first, no hardware buys)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Max McCutcheon", email = "MaxMcCutcheon1@outlook.com" }]
keywords = ["ros2", "gazebo", "robotics", "vision", "simulation", "ibvs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
# Optional heavier stack — install inside the provided Dockerfile / ROS image, not required for unit tests.
ros = []

[project.urls]
Homepage = "https://github.com/maxmccutcheon59/simreach"
Repository = "https://github.com/maxmccutcheon59/simreach"

[tool.setuptools.packages.find]
where = ["src"]
include = ["simreach_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
norecursedirs = [".git", ".venv", "*.egg-info", "install", "log", "build"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
